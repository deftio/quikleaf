name: Release

# Triggered two ways:
#   1. push of a v* tag (works when a human pushes the tag).
#   2. workflow_dispatch from ci.yml's `tag` job, run with `--ref vX.Y.Z`.
#      CI pushes the tag with GITHUB_TOKEN, and GitHub does not fire `push`
#      workflows for events created by GITHUB_TOKEN, so CI dispatches us
#      explicitly. With `--ref vX.Y.Z`, github.ref is `refs/tags/vX.Y.Z`
#      and github.ref_name is `vX.Y.Z`, so everything below works for both.
#
# npm is not published here. After the build job has attached the portable
# archives to the release, the `publish` job dispatches publish.yml, which
# publishes the `quikleaf` launcher with npm trusted publishing (OIDC). No
# npm token is involved anywhere.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write   # tauri-action / action-gh-release create and upload the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            binary: quikleaf
            binary-path: src-tauri/target/aarch64-apple-darwin/release/quikleaf
            archive-name: quikleaf-darwin-aarch64
          - platform: macos-latest
            target: x86_64-apple-darwin
            binary: quikleaf
            binary-path: src-tauri/target/x86_64-apple-darwin/release/quikleaf
            archive-name: quikleaf-darwin-x86_64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: quikleaf
            binary-path: src-tauri/target/x86_64-unknown-linux-gnu/release/quikleaf
            archive-name: quikleaf-linux-x86_64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            binary: quikleaf.exe
            binary-path: src-tauri/target/x86_64-pc-windows-msvc/release/quikleaf.exe
            archive-name: quikleaf-windows-x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Install system deps (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'quikleaf ${{ github.ref_name }}'
          releaseBody: |
            See the [CHANGELOG](https://github.com/deftio/quikleaf/blob/main/CHANGELOG.md) for details.

            ## Downloads
            | Platform | File |
            |----------|------|
            | macOS (Apple Silicon) | `.dmg` |
            | macOS (Intel) | `.dmg` |
            | Windows | `.msi` / `.exe` |
            | Linux | `.deb` / `.AppImage` |

            ## npm
            ```bash
            npm install -g quikleaf
            # or
            npx quikleaf
            ```
          # Must be published (not draft): npm/quikleaf/install.js falls back to
          # downloading https://github.com/deftio/quikleaf/releases/download/<tag>/<asset>,
          # and draft release assets are not reachable at that URL. Assets are
          # attached below by action-gh-release, which updates this same release.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      # The portable archive of the bare binary. npm/quikleaf/install.js
      # downloads exactly these names from the release, so keep them stable.
      - name: Create release archive
        shell: bash
        run: |
          mkdir -p stage release-archives
          cp ${{ matrix.binary-path }} stage/${{ matrix.binary }}
          chmod +x stage/${{ matrix.binary }} 2>/dev/null || true
          if [ "${{ runner.os }}" = "Windows" ]; then
            cd stage
            7z a -tzip ../release-archives/${{ matrix.archive-name }}.zip ${{ matrix.binary }}
            cd ..
          else
            tar czf release-archives/${{ matrix.archive-name }}.tar.gz -C stage ${{ matrix.binary }}
          fi

      - name: Upload release archive
        uses: softprops/action-gh-release@v2
        with:
          files: release-archives/*
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Dispatch publish.yml for this tag (OIDC trusted publishing of the npm
  # launcher). A dispatch rather than a job here because npm's trusted
  # publisher is bound to the workflow filename `publish.yml`; with
  # `workflow_dispatch` the OIDC claim names that file.
  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: write   # gh workflow run publish.yml
    steps:
      - name: Dispatch publish.yml for ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
