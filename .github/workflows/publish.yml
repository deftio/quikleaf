name: Publish npm

# Publishes the `quikleaf` npm launcher for one tagged release, using npm
# trusted publishing (OIDC): no NPM_TOKEN anywhere. The trusted-publisher
# configuration on npmjs.com for `quikleaf` names this file, `publish.yml`,
# on deftio/quikleaf, so the filename and repository must not change.
#
# The launcher contains no binaries. At install time `npm/quikleaf/install.js`
# downloads the platform archive from the GitHub release for its own version,
# so this job first checks that all four archives are attached to the release.
#
# Triggered two ways, always for a tag (`github.ref` must be `refs/tags/vX.Y.Z`):
#   1. release.yml dispatches it after the build job has uploaded the archives.
#   2. By hand, to (re)publish the launcher for an existing release:
#        gh workflow run publish.yml --ref vX.Y.Z
#
# Requirements for OIDC: `id-token: write`, npm CLI 11.5.1+ (Node 22's bundled
# npm is too old, hence the upgrade step), a GitHub-hosted runner, and no
# NODE_AUTH_TOKEN in the environment of `npm publish`.
on:
  workflow_dispatch:

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC token for npm trusted publishing

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (trusted publishing needs 11.5.1+)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Check the launcher version matches the tag
        working-directory: npm/quikleaf
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag: $TAG_VERSION  package.json: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::npm/quikleaf/package.json is $PKG_VERSION but the tag is $TAG_VERSION. Bump with 'npm run feature'." >&2
            exit 1
          fi

      - name: Check the release archives the launcher will download exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "$ASSETS"
          for a in quikleaf-darwin-aarch64.tar.gz quikleaf-darwin-x86_64.tar.gz quikleaf-linux-x86_64.tar.gz quikleaf-windows-x86_64.zip; do
            echo "$ASSETS" | grep -qx "$a" || { echo "::error::Release $GITHUB_REF_NAME has no asset $a; the launcher would fail to install." >&2; exit 1; }
          done

      - name: Skip if this version is already on npm
        id: exists
        working-directory: npm/quikleaf
        run: |
          V="${GITHUB_REF_NAME#v}"
          if npm view "quikleaf@$V" version >/dev/null 2>&1; then
            echo "quikleaf@$V is already published; nothing to do."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish quikleaf
        if: steps.exists.outputs.published == 'false'
        working-directory: npm/quikleaf
        run: npm publish --access public
